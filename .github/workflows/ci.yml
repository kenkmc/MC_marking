name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Core and GUI smoke tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed ($LASTEXITCODE)." }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed ($LASTEXITCODE)." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed ($LASTEXITCODE)." }

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed ($LASTEXITCODE)." }
          python -m py_compile main.py omr_core.py omr_software.py
          if ($LASTEXITCODE -ne 0) { throw "Syntax checks failed ($LASTEXITCODE)." }
          python main.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed ($LASTEXITCODE)." }
